<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>TICTACTOE</title>
</head>
<body>
    <h1>TICTACTOE</h1>
    <div id="playerSetup">
        <!--Player Input Name-->
        <label for="player1">Player1</label>
        <label for="player2">Player2</label>
        <input id="player1" type="text" name="player1" placeholder="Name" required>
        <input id="player2" type="text" name="player2" placeholder="Name" required>
        <!--Start Button-->
        <button class="btnStart">Start Game</button>
    </div>
    <div id="board"></div>
    <div id="playerInfo"></div>
    <div id="winnerInfo"></div>

    <script src="main.js"></script>
</body>
</html>
